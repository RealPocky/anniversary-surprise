<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Login</title>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Itim&display=swap" rel="stylesheet">

        <link rel="stylesheet" href="style/login.css" />
    </head>
    <body>
        <div class="login-container">
            <h1 class="prompt-medium">🌸LOGIN🌸</h1>
            <form id="loginForm">
            <label class="prompt-semibold" for="username">Username</label>
            <input type="text" id="username" placeholder="username" required />
            
            <label class="prompt-semibold" for="password">Password</label>
            <input type="password" id="password" placeholder="เช่น dd/mm/yy" required />
            <button type="submit">เข้าสู่เว็บไซต์</button>
            <p id="error-msg" class="error"></p>
            </form>
        </div>
        <script src="script/login.js"></script>
    </body>
</html>
